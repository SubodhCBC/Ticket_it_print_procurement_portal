# Local development dependencies.
#
# The app itself runs on the host (`npm run dev`) for fast reload; only the
# stateful services live in Docker. Every version here is pinned to the same
# major used in staging and production so "works on my machine" stays true.
#
# The project name matches the one the NestJS repo used, so the existing
# redis / minio / mailpit containers and their volumes are adopted rather than
# duplicated.

name: ticketit

services:
  # ---------------------------------------------------------------------------
  # Microsoft SQL Server — the portal's own database.
  #
  # The same engine as the legacy Ticket-IT database and as production, which is
  # the whole point: Row-Level Security, SEQUENCE objects and DATETIMEOFFSET all
  # behave here exactly as they will on the server. A local MySQL or PostgreSQL
  # would mean developing against a different application.
  #
  # Developer Edition is free for non-production use, which is what MSSQL_PID
  # selects. Without it the image starts as Express, which caps the database at
  # 10GB and quietly changes the plan cache behaviour.
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ticketit-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      # Local-only credential. SQL Server refuses to start on a weak one: it
      # wants 8+ characters from three of the four character classes.
      MSSQL_SA_PASSWORD: 'Ticketit_Local_2026!'
      # UTC, like the server. Every timestamp in the schema is DATETIMEOFFSET
      # and every write goes in as UTC; a container on local time would make
      # that convention look correct locally and wrong in production.
      TZ: Etc/UTC
    ports:
      # Project-specific host port. Developer machines frequently already run a
      # SQL Server instance on 1433; that service wins the binding and the app
      # then fails with a login error that looks like a wrong password.
      - '51433:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # sqlcmd 18 refuses self-signed certificates unless told otherwise, hence
      # -C. The container generates its own certificate on first start.
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      # SQL Server takes appreciably longer than PostgreSQL to become ready on a
      # cold start, and the first start also lays down the system databases.
      retries: 20
      start_period: 30s

  # One-shot: creates the database and the application login, so a fresh clone
  # just works. Prisma will not create either — `migrate deploy` expects to
  # connect to a database that already exists.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ticketit-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: 'Ticketit_Local_2026!'
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "
        IF DB_ID('ticketit') IS NULL CREATE DATABASE [ticketit];
        -- Prisma rebuilds the schema from scratch here to detect drift. It
        -- would create this itself, but only with the dbcreator role, which
        -- the application login must never hold.
        IF DB_ID('ticketit_shadow') IS NULL CREATE DATABASE [ticketit_shadow];
        " &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "
        IF SUSER_ID('ticketit') IS NULL
          CREATE LOGIN [ticketit] WITH PASSWORD = 'Ticketit_Local_2026!', CHECK_POLICY = OFF;
        " &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -d ticketit -Q "
        IF USER_ID('ticketit') IS NULL CREATE USER [ticketit] FOR LOGIN [ticketit];
        ALTER ROLE db_owner ADD MEMBER [ticketit];
        " &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -d ticketit_shadow -Q "
        IF USER_ID('ticketit') IS NULL CREATE USER [ticketit] FOR LOGIN [ticketit];
        ALTER ROLE db_owner ADD MEMBER [ticketit];
        " &&
        # Read-committed snapshot, and not as a tuning knob. This application
        # was written against PostgreSQL, whose READ COMMITTED never blocks a
        # reader behind a writer. SQL Server's default takes shared locks
        # instead, so the same code stalls or deadlocks under concurrency that
        # PostgreSQL handled without noticing. RCSI restores the semantics the
        # code was designed for.
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "
        ALTER DATABASE [ticketit] SET READ_COMMITTED_SNAPSHOT ON WITH ROLLBACK IMMEDIATE;
        " &&
        echo 'database ready'
    restart: 'no'

  redis:
    image: redis:7.4-alpine
    container_name: ticketit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    # appendonly keeps queued jobs across a restart; losing them means losing
    # pending emails and webhook deliveries.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ticketit-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    command: ['server', '/data', '--console-address', ':9001']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket the app expects so a fresh clone just works.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: ticketit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ticketit-assets &&
      mc anonymous set download local/ticketit-assets &&
      echo 'bucket ready'
      "

  mailhog:
    image: axllent/mailpit:v1.21
    container_name: ticketit-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  sqlserver-data:
  redis-data:
  minio-data:
